spring:
  application:
    name: traintrack-audit-service

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/traintrack_audit
    username: ${POSTGRES_USER:traintrack}
    password: ${POSTGRES_PASSWORD:traintrack}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:29092}
    consumer:
      group-id: audit-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # Used only by DeadLetterPublishingRecoverer to publish poison messages
      # to audit.events.DLT.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.traintrack: DEBUG
