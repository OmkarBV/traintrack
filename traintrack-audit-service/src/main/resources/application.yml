spring:
  application:
    name: traintrack-audit-service

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/traintrack_audit
    username: ${POSTGRES_USER:traintrack}
    password: ${POSTGRES_PASSWORD:traintrack}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.traintrack: DEBUG
