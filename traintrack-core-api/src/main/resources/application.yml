spring:
  application:
    name: traintrack-core-api

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:traintrack_core}
    username: ${POSTGRES_USER:traintrack}
    password: ${POSTGRES_PASSWORD:traintrack}

  jpa:
    # Flyway owns the schema. Hibernate only validates that entity mappings
    # match what Flyway created — it never generates or alters DDL.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.traintrack: DEBUG
