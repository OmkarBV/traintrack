spring:
  application:
    name: traintrack-core-api

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:traintrack_core}
    username: ${POSTGRES_USER:traintrack}
    password: ${POSTGRES_PASSWORD:traintrack}

  jpa:
    # Flyway owns the schema. Hibernate only validates that entity mappings
    # match what Flyway created — it never generates or alters DDL.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    # Lets Spring's own exception resolution (missing/malformed request
    # headers, unreadable JSON, 404s, etc.) produce RFC 7807 responses too,
    # not just the exceptions GlobalExceptionHandler explicitly maps.
    problemdetails:
      enabled: true

traintrack:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-value-in-real-environments}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}m
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL_DAYS:7}d

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.traintrack: DEBUG
