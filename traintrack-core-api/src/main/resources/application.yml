spring:
  application:
    name: traintrack-core-api

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:traintrack_core}
    username: ${POSTGRES_USER:traintrack}
    password: ${POSTGRES_PASSWORD:traintrack}
    hikari:
      # Explicit, not the default 10: bulk-enrolment's worker pool (see
      # BulkEnrolmentExecutorConfig) can hold up to 8 connections at once
      # doing row-processing work; 15 leaves 7 free for ordinary request
      # traffic while a bulk job is running.
      maximum-pool-size: 15

  jpa:
    # Flyway owns the schema. Hibernate only validates that entity mappings
    # match what Flyway created — it never generates or alters DDL.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    # Lets Spring's own exception resolution (missing/malformed request
    # headers, unreadable JSON, 404s, etc.) produce RFC 7807 responses too,
    # not just the exceptions GlobalExceptionHandler explicitly maps.
    problemdetails:
      enabled: true

  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Wait for all in-sync replicas — a no-op on the single-broker local
      # setup, but the correct durability setting for a real cluster.
      acks: all

traintrack:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-value-in-real-environments}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}m
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL_DAYS:7}d

  s3:
    bucket: ${S3_BUCKET_NAME:traintrack-certificates}
    region: ${AWS_REGION:us-east-1}
    # Set only for LocalStack — leave AWS_S3_ENDPOINT unset in real
    # environments so the SDK talks to AWS's own regional endpoints.
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:4566}
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
    presigned-url-ttl: ${S3_PRESIGNED_URL_TTL_MINUTES:15}m

  assistant:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-5}
    max-tokens: ${ANTHROPIC_MAX_TOKENS:1024}
    rate-limit:
      max-requests: ${ASSISTANT_RATE_LIMIT_MAX_REQUESTS:20}
      window: ${ASSISTANT_RATE_LIMIT_WINDOW_MINUTES:60}m

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.traintrack: DEBUG
